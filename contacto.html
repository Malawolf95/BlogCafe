<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="img/descanso.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/normalize.css">
    <title>Contacto | Cafe</title>
</head>
<body>
    
    <header class="header">

        <div class="contenedor">
            <div class="barra">

                <a class="logo" href="index.html">
                    <h1 class="logo__nombre centrar-texto">Blog<span class="logo__bold">DeCafé</span></h1>
                 </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">contacto</a>
                </nav>

            </div>

        </div><!-- contenedor -->

        <div class="header__texto">
            <h2>Blog de cafe con consejos y cursos</h2>
            <p>Aprende de los expertos con las mejores recetas y consejos</p>
        </div>

    </header>

    <main class="contenedor">
        <h3 class="centrar-texto">Contacto</h3>

        <div class="contacto-imagen"></div>

            <form class="formulario">

                <div class="campo">
                    <label class="campo__label" for="nombre">Nombre: </label>
                    <input class="campo__field" type="text" placeholder="Nombre: " id="nombre" required>
                </div>
                <div class="campo">
                    <label class="campo__label" for="email">E-mail: </label>
                    <input class="campo__field" type="email" placeholder="ejemplo@gmail.com: " id="email" required>
                </div>
                <div class="campo">
                    <label class="campo__label" for="texto">Texto: </label>
                    <textarea class="campo__field--textarea campo__field" name="" id="texto"></textarea>
                </div>

                <div class="campo">
                    <input type="submit" class="boton boton--primario" value="Enviar">
                </div>
            
            </form>

    </main>

    <footer class="footer">
        <a class="logo" href="index.html">
            <h3 class="logo__nombre">Blog<span class="logo__bold">DeCafé</span></h3>
        </a>

        <div>
            <a class="footer__enlace" href="#">Nosotros</a>
            <a class="footer__enlace" href="#">Contacto</a>
            <a class="footer__enlace" href="#">Cursos</a>
        </div>
    </footer>

</body>
</html>
